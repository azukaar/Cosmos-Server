      security:
      - BearerAuth: []
      summary: Drain a volume server of a managed SeaweedFS instance
      tags:
      - seaweedfs
  /api/constellation/seaweedfs/{name}/jobs:
    put:
      consumes:
      - application/json
      description: Replaces the maintenance-job configuration; the schedules are re-registered
        within a minute (Pro feature)
      parameters:
      - description: Instance name
        in: path
        name: name
        required: true
        type: string
      - description: Job configuration
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/pro.SwfsJobsConfig'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
