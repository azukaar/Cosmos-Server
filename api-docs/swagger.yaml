    post:
      consumes:
      - application/json
      description: |-
        Toggles constellation-only access to the S3 endpoint. The filers are cycled one
        node at a time to apply it (Pro feature).
      parameters:
      - description: Instance name
        in: path
        name: name
        required: true
        type: string
      - description: Restriction to apply
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/pro.SeaweedFSRestrictRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
