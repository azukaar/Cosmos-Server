  /api/constellation/registries:
    get:
      description: Returns every registry with the nodes serving it and its stored-size
        rollup, secrets redacted (Pro feature)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: List package registries
      tags:
      - registry
    post:
      consumes:
      - application/json
      description: |-
        Claims the name, provisions the backing bucket and marks the registry ready.
        Every type but static is served on the given host from then on; a static
        registry publishes its sites instead (Pro feature).
      parameters:
      - description: Registry to create
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/pro.RegistryCreateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Create a package registry
      tags:
      - registry
  /api/constellation/registries/{name}:
    delete:
      description: |-
        Removes the record and every metadata key; serving nodes withdraw
        the endpoint. Stored blobs are PRESERVED unless purgeData=true,
        which best-effort empties the backing bucket (the bucket itself is
        left in place) (Pro feature).
      parameters:
      - description: Registry name
        in: path
        name: name
        required: true
        type: string
      - description: Also delete every stored blob
        in: query
        name: purgeData
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Delete a package registry
      tags:
      - registry
    get:
      description: Returns the registry with the nodes serving it and its stored-size
        rollup, secrets redacted (Pro feature)
      parameters:
      - description: Registry name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Get one package registry
      tags:
      - registry
  /api/constellation/registries/{name}/gc:
    post:
      description: |-
        Starts a mark-and-sweep of the registry's blob store and reconciles its
        stored-size and package counters. Returns 202 immediately; the outcome
        arrives as a cosmos.registry.gc event. Blobs younger than 24 hours are
        never collected, whether or not anything references them (Pro feature).
      parameters:
      - description: Registry name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Run a registry's garbage collection now
      tags:
      - registry
  /api/constellation/registries/{name}/packages:
    get:
      description: |-
        Returns every package with its versions and their files. Works for every
        registry type but static: a docker image's versions are its manifests
        (named by digest, with the tags resolving to each), an npm package's are
        its published versions with their dist-tags (Pro feature)
      parameters:
      - description: Registry name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: List the packages of a registry
      tags:
      - registry
  /api/constellation/registries/{name}/packages/{package}:
    delete:
      description: |-
        Removes the package and every version; the stored files are reclaimed by the next GC pass.
        Accepts a Cosmos token or a registry deploy token with push scope (Pro feature).
      parameters:
      - description: Registry name
        in: path
        name: name
        required: true
        type: string
      - description: Package name
        in: path
        name: package
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Delete one package
      tags:
      - registry
    get:
      description: Returns the package with its versions and files (Pro feature)
      parameters:
      - description: Registry name
        in: path
        name: name
        required: true
        type: string
      - description: Package name
        in: path
        name: package
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Get one package
      tags:
      - registry
  /api/constellation/registries/{name}/packages/{package}/versions:
    post:
      consumes:
      - application/octet-stream
      description: |-
        Stores one or more files under a version. Accepts a multipart form (every
        file part is stored under its own filename) or a single raw file as the
        request body, in which case the filename query parameter is required.
        Query parameters: version (default: a UTC timestamp), filename. A file
        that already exists in the version is refused (409): upload a new version
        or delete it first. Accepts a Cosmos token with the Resources permission
        OR a registry deploy token with push scope on an access that exposes this
        registry (Pro feature).
      parameters:
      - description: Registry name
        in: path
        name: name
        required: true
        type: string
      - description: Package name
        in: path
        name: package
        required: true
        type: string
      - description: 'Version (default: UTC timestamp)'
        in: query
        name: version
        type: string
      - description: Filename, required for a raw body
        in: query
        name: filename
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Upload files into a generic package version
      tags:
      - registry
  /api/constellation/registries/{name}/packages/{package}/versions/{version}:
    delete:
      description: |-
        Removes the version and its file entries; the stored files are reclaimed
        by the next GC pass. For generic and pypi, "latest" is re-pointed at the
        newest remaining version; for docker (a manifest, by digest) and npm every
        tag resolving to the deleted version is dropped instead (Pro feature).
      parameters:
      - description: Registry name
        in: path
        name: name
        required: true
        type: string
      - description: Package name
        in: path
        name: package
        required: true
        type: string
      - description: Version
        in: path
        name: version
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Delete one package version
      tags:
      - registry
  /api/constellation/registries/{name}/packages/{package}/versions/{version}/files/{file}:
    delete:
      description: |-
        Removes the file entry, and the version when it was its last file; the stored bytes are
        reclaimed by the next GC pass. Refused for docker and npm, whose versions are deleted whole.
        Accepts a Cosmos token or a registry deploy token with push scope (Pro feature).
      parameters:
      - description: Registry name
        in: path
        name: name
        required: true
        type: string
      - description: Package name
        in: path
        name: package
        required: true
        type: string
      - description: Version
        in: path
        name: version
        required: true
        type: string
      - description: Filename
        in: path
        name: file
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Delete one file of a package version
      tags:
      - registry
    get:
      description: |-
        Streams the file (the version may be "latest"); accepts a Cosmos token
        with the Resources read permission OR a registry deploy token with pull
        scope (Pro feature).
      parameters:
      - description: Registry name
        in: path
        name: name
        required: true
        type: string
      - description: Package name
        in: path
        name: package
        required: true
        type: string
      - description: Version, or latest
        in: path
        name: version
        required: true
        type: string
      - description: Filename
        in: path
        name: file
        required: true
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: OK
          schema:
            type: file
      security:
      - BearerAuth: []
      summary: Download one file of a package version
      tags:
      - registry
  /api/constellation/registries/{name}/settings:
    put:
      consumes:
      - application/json
      description: |-
        Replaces the quota, the host, the visibility, the anonymous-pull policy, the
        serving tags or the whole user-facing route. Absent fields keep their stored
        value (Pro feature).
      parameters:
      - description: Registry name
        in: path
        name: name
        required: true
        type: string
      - description: Settings to change
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/pro.RegistrySettingsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Update a registry's settings
      tags:
      - registry
  /api/constellation/registries/{name}/sites:
    get:
      description: |-
        Returns every site with its deployments, which one is active, and its
        route configuration (Pro feature)
      parameters:
      - description: Registry name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: List the sites of a static registry
      tags:
      - registry
  /api/constellation/registries/{name}/sites/{site}:
    delete:
      description: Removes the site and all its deployments; the stored zips are reclaimed
        by the next GC pass (Pro feature)
      parameters:
      - description: Registry name
        in: path
        name: name
        required: true
        type: string
      - description: Site name
        in: path
        name: site
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Delete one static site
      tags:
      - registry
    get:
      description: Returns the site with its deployments (Pro feature)
      parameters:
      - description: Registry name
        in: path
        name: name
        required: true
        type: string
      - description: Site name
        in: path
        name: site
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Get one static site
      tags:
      - registry
    put:
      consumes:
      - application/json
      description: |-
        Replaces the site's route configuration (host, internal, spa, tags or the whole user-facing
        route); absent fields keep their stored value. Admin only: a deploy token cannot move a site (Pro feature).
      parameters:
      - description: Registry name
        in: path
        name: name
        required: true
        type: string
      - description: Site name
        in: path
        name: site
        required: true
        type: string
      - description: Settings to change
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/pro.RegistryStaticSiteSettings'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Configure one static site
      tags:
      - registry
  /api/constellation/registries/{name}/sites/{site}/activate:
    post:
      consumes:
      - application/json
      description: |-
        Moves the site's active pointer. This is BOTH deploy and rollback: the
        deployments are immutable, so switching between them is instant and
        cannot half-apply. Accepts a Cosmos token with the Resources permission
        OR a registry deploy token with push scope (Pro feature).
      parameters:
      - description: Registry name
        in: path
        name: name
        required: true
        type: string
      - description: Site name
        in: path
        name: site
        required: true
        type: string
      - description: Deployment to activate
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/pro.RegistryStaticActivateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Activate a static-site deployment
      tags:
      - registry
  /api/constellation/registries/{name}/sites/{site}/versions:
    post:
      consumes:
      - application/octet-stream
      description: |-
        Stores a zip as one immutable deployment. Accepts a multipart form
        (field "file") or the raw zip as the request body. Query parameters:
        version (default: a UTC timestamp), activate (default true for the
        site's first deployment), host/internal/spa/tags to configure the
        site's route on first upload. Accepts a Cosmos token with the
        Resources permission OR a deploy token of this registry with push scope
        (Pro feature).
      parameters:
      - description: Registry name
        in: path
        name: name
        required: true
        type: string
      - description: Site name
        in: path
        name: site
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Upload a static-site deployment
      tags:
      - registry
  /api/constellation/registries/{name}/sites/{site}/versions/{version}:
    delete:
      description: |-
        Removes the deployment record; the stored zip is reclaimed by the next
        GC pass. Refused for the deployment that is currently active (Pro feature).
      parameters:
      - description: Registry name
        in: path
        name: name
        required: true
        type: string
      - description: Site name
        in: path
        name: site
        required: true
        type: string
      - description: Deployment version
        in: path
        name: version
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Delete one static-site deployment
      tags:
      - registry
  /api/constellation/registries/{name}/sites/{site}/versions/{version}/download:
    get:
      description: |-
        Streams the zip exactly as it was uploaded (the version may be "active"
        for the one currently served). Accepts a Cosmos token with the Resources
        read permission OR a registry deploy token with pull scope (Pro feature).
      parameters:
      - description: Registry name
        in: path
        name: name
        required: true
        type: string
      - description: Site name
        in: path
        name: site
        required: true
        type: string
      - description: Deployment version, or active
        in: path
        name: version
        required: true
        type: string
      produces:
      - application/zip
      responses:
        "200":
          description: OK
          schema:
            type: file
      security:
      - BearerAuth: []
      summary: Download one static-site deployment archive
      tags:
      - registry
  /api/constellation/registries/{name}/tokens:
    post:
      consumes:
      - application/json
      description: |-
        Creates a deploy token on the registry. The raw token is returned ONCE, in this
        response, and never stored. Scopes default to pull+push (Pro feature).
      parameters:
      - description: Registry name
        in: path
        name: name
        required: true
        type: string
      - description: Token to mint
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/pro.RegistryTokenCreateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Mint a registry deploy token
      tags:
      - registry
  /api/constellation/registries/{name}/tokens/{tokenName}:
    delete:
      description: |-
        Removes the token; it stops working on this node at once and on the others
        within their cache TTL (Pro feature).
      parameters:
      - description: Registry name
        in: path
        name: name
        required: true
        type: string
      - description: Token name
        in: path
        name: tokenName
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Revoke a registry deploy token
      tags:
      - registry
  /api/constellation/reset:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.HTTPErrorResult'
      security:
      - BearerAuth: []
      summary: Reset the Nebula VPN configuration
      tags:
      - constellation
  /api/constellation/restart:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.HTTPErrorResult'
      security:
      - BearerAuth: []
      summary: Restart the Nebula VPN service and HTTP server
      tags:
      - constellation
  /api/constellation/seaweedfs:
    get:
      description: Returns every instance with heartbeat-derived status, secrets redacted
        (Pro feature)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: List managed SeaweedFS instances
      tags:
      - seaweedfs
    post:
      consumes:
      - application/json
      description: |-
        Provisions 3 pinned masters on the first three constellation managers,
        a fill-mode volume-server deployment on the chosen tags, a filer+S3
        deployment behind the tunnel LB, and a managed postgres for the filer
        store (Pro feature). Refused when fewer than 3 managers are online.
      parameters:
      - description: Instance to create
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/pro.SeaweedFSCreateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Create a managed SeaweedFS instance
      tags:
      - seaweedfs
  /api/constellation/seaweedfs/{name}:
    delete:
      description: |-
        Tears down deployments, masters and (by default) the filer database.
        Volume-server data volumes are PRESERVED unless purgeData=true;
        keepFilerDB=true keeps the managed database entirely (Pro feature).
      parameters:
      - description: Instance name
        in: path
        name: name
        required: true
        type: string
      - description: Also remove the data volumes on every node
        in: query
        name: purgeData
        type: boolean
      - description: Keep the auto-provisioned filer database
        in: query
        name: keepFilerDB
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Delete a managed SeaweedFS instance
      tags:
      - seaweedfs
    get:
      description: Returns the instance with heartbeat-derived status, secrets redacted
        (Pro feature)
      parameters:
      - description: Instance name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Get one managed SeaweedFS instance
      tags:
      - seaweedfs
  /api/constellation/seaweedfs/{name}/backup:
    delete:
      description: Clears the backup configuration. The repository and its snapshots
        are left untouched (Pro feature).
      parameters:
      - description: Instance name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Remove the metadata backup of a managed SeaweedFS instance
      tags:
      - seaweedfs
    put:
      consumes:
      - application/json
      description: |-
        Sets the metadata-backup repository and schedules. The repository password is minted once
        and never rotated: it is the only key to the snapshots already written (Pro feature).
      parameters:
      - description: Instance name
        in: path
        name: name
        required: true
        type: string
      - description: Backup configuration
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/pro.ManagedDBBackupRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Configure the metadata backup of a managed SeaweedFS instance
      tags:
      - seaweedfs
  /api/constellation/seaweedfs/{name}/backup/run:
    post:
      description: Starts a metadata backup on the node running the instance's jobs
        (Pro feature)
      parameters:
      - description: Instance name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Run the metadata backup of a managed SeaweedFS instance now
      tags:
      - seaweedfs
  /api/constellation/seaweedfs/{name}/backup/snapshots:
    get:
      description: Returns the snapshots of the metadata-backup repository (Pro feature)
      parameters:
      - description: Instance name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: List the metadata snapshots of a managed SeaweedFS instance
      tags:
      - seaweedfs
  /api/constellation/seaweedfs/{name}/drain:
    post:
      consumes:
      - application/json
      description: |-
        Starts the evacuation of one live volume server, so its node can be untagged afterwards
        without ever being under-replicated (Pro feature).
      parameters:
      - description: Instance name
        in: path
        name: name
        required: true
        type: string
      - description: Device to drain
