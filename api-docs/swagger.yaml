    post:
      consumes:
      - application/json
      description: |-
        Moves the site's active pointer. This is BOTH deploy and rollback: the
        deployments are immutable, so switching between them is instant and
        cannot half-apply. Accepts a Cosmos token with the Resources permission
        OR a registry deploy token with push scope (Pro feature).
      parameters:
      - description: Registry name
        in: path
        name: name
        required: true
        type: string
      - description: Site name
        in: path
        name: site
        required: true
        type: string
      - description: Deployment to activate
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/pro.RegistryStaticActivateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Activate a static-site deployment
      tags:
      - registry
  /api/constellation/registries/{name}/sites/{site}/versions:
    post:
      consumes:
      - application/octet-stream
      description: |-
        Stores a zip as one immutable deployment. Accepts a multipart form
        (field "file") or the raw zip as the request body. Query parameters:
        version (default: a UTC timestamp), activate (default true for the
        site's first deployment), host/internal/spa/tags to configure the
        site's route on first upload. Accepts a Cosmos token with the
        Resources permission OR a registry deploy token with push scope on an
        access that exposes this registry (Pro feature).
      parameters:
      - description: Registry name
        in: path
        name: name
        required: true
        type: string
      - description: Site name
        in: path
        name: site
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Upload a static-site deployment
      tags:
      - registry
  /api/constellation/registries/{name}/sites/{site}/versions/{version}:
    delete:
      description: |-
        Removes the deployment record; the stored zip is reclaimed by the next
        GC pass. Refused for the deployment that is currently active (Pro feature).
      parameters:
      - description: Registry name
        in: path
        name: name
        required: true
        type: string
      - description: Site name
        in: path
        name: site
        required: true
        type: string
      - description: Deployment version
        in: path
        name: version
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Delete one static-site deployment
      tags:
      - registry
  /api/constellation/registries/{name}/sites/{site}/versions/{version}/download:
    get:
      description: |-
        Streams the zip exactly as it was uploaded (the version may be "active"
        for the one currently served). Accepts a Cosmos token with the Resources
        read permission OR a registry deploy token with pull scope (Pro feature).
      parameters:
      - description: Registry name
        in: path
        name: name
        required: true
        type: string
      - description: Site name
        in: path
        name: site
        required: true
        type: string
      - description: Deployment version, or active
        in: path
        name: version
        required: true
        type: string
      produces:
      - application/zip
      responses:
        "200":
          description: OK
          schema:
            type: file
      security:
      - BearerAuth: []
      summary: Download one static-site deployment archive
      tags:
      - registry
  /api/constellation/registry-accesses:
    get:
      description: Returns every registry endpoint with the nodes currently serving
        it, token hashes redacted (Pro feature)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: List registry accesses
      tags:
      - registry
    post:
      consumes:
      - application/json
      description: |-
        Publishes one or more registries on a hostname. Every exposed registry
        must share ONE type, so an access serves exactly one protocol (several
        docker registries are fine — they namespace by path; an npm or generic
        access exposes exactly one registry); an empty tag list means every node
        serves it; internal restricts the endpoint to the constellation (Pro feature).
      parameters:
      - description: Access to create
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/pro.RegistryAccessCreateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
