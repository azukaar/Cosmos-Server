  /api/zones/{zone}:
    delete:
      description: Deletes the explicit zone. Its hostnames fall back to the next
        matching zone, or to a derived zone each. Replicated to the whole Constellation.
      parameters:
      - description: Zone name
        in: path
        name: zone
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.HTTPErrorResult'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.HTTPErrorResult'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.HTTPErrorResult'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/utils.HTTPErrorResult'
      security:
      - BearerAuth: []
      summary: Delete a DNS zone
      tags:
      - zones
    put:
      consumes:
      - application/json
      description: Creates the explicit zone, or replaces it. A zone is a domain with
        its HTTPS setup (certificate mode, DNS challenge provider, wildcard) and its
        DynDNS setup. Every hostname under the domain uses it, unless a longer zone
        matches. The certificate mode is LETSENCRYPT, SELFSIGNED, PROVIDED (TLSCert
        and TLSKey in PEM format) or DISABLED (plain HTTP), and no server-wide mode
        overrides it. Replicated to the whole Constellation. Credentials sent empty
        by a client without the credentials permission keep their current value, and
        so does the private key of a provided certificate, which is never returned.
      parameters:
      - description: Zone name, e.g. example.com
        in: path
        name: zone
        required: true
        type: string
      - description: Zone configuration
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/utils.DNSZoneConfig'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.HTTPErrorResult'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.HTTPErrorResult'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.HTTPErrorResult'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/utils.HTTPErrorResult'
      security:
      - BearerAuth: []
      summary: Create or replace a DNS zone
      tags:
      - zones
