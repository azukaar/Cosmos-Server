basePath: /cosmos
definitions:
  configapi.AdvertisedAddressOption:
    properties:
      address:
        type: string
      value:
        type: string
    type: object
  configapi.AdvertisedAddressesResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/configapi.AdvertisedAddressOption'
        type: array
      status:
        type: string
    type: object
  configapi.CreateAPITokenRequest:
    properties:
      description:
        type: string
      expiryDays:
        type: integer
      ipWhitelist:
        items:
          type: string
        type: array
      name:
        type: string
      permissions:
        items:
          $ref: '#/definitions/utils.Permission'
        type: array
      readOnly:
        type: boolean
      restrictToConstellation:
        type: boolean
    required:
    - name
    type: object
  configapi.DNSConfigRequest:
    properties:
      customDNSEntries:
        items:
          $ref: '#/definitions/utils.ConstellationDNSEntry'
        type: array
      dnsAdditionalBlocklists:
        items:
          type: string
        type: array
      dnsBlockBlacklist:
        type: boolean
      dnsFallback:
        type: string
      dnsPort:
        type: string
    type: object
  configapi.DashboardRoute:
    properties:
      ContainerIcon:
        type: string
      ContainerRunning:
        description: Container info (for SERVAPP routes)
        type: boolean
      Description:
        type: string
      HideFromDashboard:
        type: boolean
      Host:
        type: string
      Icon:
        type: string
      Mode:
        type: string
      Name:
        type: string
      PathPrefix:
        type: string
      Target:
        type: string
      UseHost:
        type: boolean
      UsePathPrefix:
        type: boolean
    type: object
  configapi.DeleteAPITokenRequest:
    properties:
      name:
        type: string
    required:
    - name
    type: object
  configapi.UpdateAPITokenRequest:
    properties:
      description:
        type: string
      ipWhitelist:
        items:
          type: string
        type: array
      permissions:
        items:
          $ref: '#/definitions/utils.Permission'
        type: array
      restrictToConstellation:
        type: boolean
    type: object
  configapi.UpdateRouteRequest:
    properties:
      newRoute:
        $ref: '#/definitions/utils.ProxyRouteConfig'
      operation:
        type: string
      routeName:
        type: string
    required:
    - operation
    type: object
  configapi.ZoneCertStatus:
    properties:
      hosts:
        items:
          type: string
        type: array
      issuedBy:
        type: string
      validUntil:
        type: string
    type: object
  configapi.ZoneStatus:
    properties:
      DNSChallengeConfig:
        additionalProperties:
          type: string
        type: object
      TLSCert:
        type: string
      TLSKey:
        type: string
      certificate:
        $ref: '#/definitions/configapi.ZoneCertStatus'
      derived:
        type: boolean
      disablePropagationChecks:
        type: boolean
      dnschallengePropagationWait:
        type: integer
      dnschallengeProvider:
        type: string
      dnschallengeResolvers:
        type: string
      hostCertificates:
        additionalProperties:
          $ref: '#/definitions/utils.HostCertificate'
        type: object
      hosts:
        items:
          type: string
        type: array
      httpscertificateMode:
        description: |-
          HTTPS setup. The mode is LETSENCRYPT, SELFSIGNED, PROVIDED (the
          certificate below) or DISABLED (the hostnames are served over plain HTTP).
          The zone decides alone: no server has an HTTPS mode of its own to
          override it, only the choice of not serving HTTPS at all.
        type: string
      issuesCertificate:
        description: |-
          IssuesCertificate is true when the zone gets a certificate of its own
          through its DNS provider; its hostnames use this node's one otherwise
        type: boolean
      manageRecords:
        description: DynDNS setup, needs a DNSChallengeProvider
        type: boolean
      records:
        allOf:
        - $ref: '#/definitions/dnsrecords.ZoneStatus'
        description: |-
          Records is the DynDNS state of the zone, only known by the node writing
          the records (this node when standalone, the cluster leader otherwise)
      recordsSupported:
        description: RecordsSupported is true when the DNS provider of the zone can
          manage records
        type: boolean
      useWildcardCertificate:
        type: boolean
      wildcardRecord:
        type: boolean
      zone:
        type: string
    required:
    - zone
    type: object
  configapi.ZonesResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/configapi.ZoneStatus'
        type: array
      status:
        type: string
    type: object
  constellation.DeviceBlockRequestJSON:
    properties:
      block:
        type: boolean
      deviceName:
        maxLength: 32
        minLength: 3
        type: string
      nickname:
        maxLength: 32
        minLength: 3
        type: string
    required:
    - deviceName
    type: object
  constellation.DeviceCreateRequestJSON:
    properties:
      PublicHostname:
        type: string
      cosmosNode:
        type: integer
      deviceName:
        maxLength: 32
        minLength: 3
        type: string
      invisible:
        type: boolean
      ip:
        type: string
      isExitNode:
        type: boolean
      isLighthouse:
        description: for lighthouse only
        type: boolean
      isLoadBalancer:
        type: boolean
      isRelay:
        type: boolean
      nickname:
        description: for devices only
        maxLength: 32
        type: string
      port:
        type: string
    required:
    - deviceName
    - ip
    type: object
  constellation.DeviceEditRequestJSON:
    properties:
      deviceName:
        description: Empty means "this node" (full edit); set means a remote tags-only
          edit.
        maxLength: 32
        minLength: 3
        type: string
      isExitNode:
        type: boolean
      isLighthouse:
        type: boolean
      isLoadBalancer:
        type: boolean
      isRelay:
        type: boolean
      tags:
        items:
          type: string
        type: array
    type: object
  constellation.DeviceResyncRequest:
    properties:
      deviceName:
        maxLength: 32
        minLength: 3
        type: string
      nickname:
        maxLength: 32
        type: string
    required:
    - deviceName
    type: object
  container.Config:
    properties:
      argsEscaped:
        description: True if command is already escaped (meaning treat as a command
          line) (Windows specific).
        type: boolean
      attachStderr:
        description: Attach the standard error
        type: boolean
      attachStdin:
        description: Attach the standard input, makes possible user interaction
        type: boolean
      attachStdout:
        description: Attach the standard output
        type: boolean
      cmd:
        description: Command to run when starting the container
        items:
          type: string
        type: array
      domainname:
        description: Domainname
        type: string
      entrypoint:
        description: Entrypoint to run when starting the container
        items:
          type: string
        type: array
      env:
        description: List of environment variable to set in the container
        items:
          type: string
        type: array
      exposedPorts:
        allOf:
        - $ref: '#/definitions/nat.PortSet'
        description: List of exposed ports
      healthcheck:
        allOf:
        - $ref: '#/definitions/container.HealthConfig'
        description: Healthcheck describes how to check the container is healthy
      hostname:
        description: Hostname
        type: string
      image:
        description: Name of the image as it was passed by the operator (e.g. could
          be symbolic)
        type: string
      labels:
        additionalProperties:
          type: string
        description: List of labels set to this container
        type: object
      macAddress:
        description: |-
          Mac Address of the container.

          Deprecated: this field is deprecated since API v1.44. Use EndpointSettings.MacAddress instead.
        type: string
      networkDisabled:
        description: Is network disabled
        type: boolean
      onBuild:
        description: ONBUILD metadata that were defined on the image Dockerfile
        items:
          type: string
        type: array
      openStdin:
        description: Open stdin
        type: boolean
      shell:
        description: Shell for shell-form of RUN, CMD, ENTRYPOINT
        items:
          type: string
        type: array
      stdinOnce:
        description: If true, close stdin after the 1 attached client disconnects.
        type: boolean
      stopSignal:
        description: Signal to stop a container
        type: string
      stopTimeout:
        description: Timeout (in seconds) to stop a container
        type: integer
      tty:
        description: Attach standard streams to a tty, including stdin if it is not
          closed.
        type: boolean
      user:
        description: User that will run the command(s) inside the container, also
          support user:group
        type: string
      volumes:
        additionalProperties:
          type: object
        description: List of volumes (mounts) used for the container
        type: object
      workingDir:
        description: Current directory (PWD) in the command will be launched
        type: string
    type: object
  container.HealthConfig:
    properties:
      interval:
        allOf:
        - $ref: '#/definitions/time.Duration'
        description: Zero means to inherit. Durations are expressed as integer nanoseconds.
      retries:
        description: |-
          Retries is the number of consecutive failures needed to consider a container as unhealthy.
          Zero means inherit.
        type: integer
      startInterval:
        allOf:
        - $ref: '#/definitions/time.Duration'
        description: The interval to attempt healthchecks at during the start period
      startPeriod:
        allOf:
        - $ref: '#/definitions/time.Duration'
        description: The start period for the container to initialize before the retries
          starts to count down.
      test:
        description: |-
          Test is the test to perform to check that the container is healthy.
          An empty slice means to inherit the default.
          The options are:
          {} : inherit healthcheck
          {"NONE"} : disable healthcheck
          {"CMD", args...} : exec arguments directly
          {"CMD-SHELL", command} : run command with system's default shell
        items:
          type: string
        type: array
      timeout:
        allOf:
        - $ref: '#/definitions/time.Duration'
        description: Timeout is the time to wait before considering the check to have
          hung.
    type: object
  cron.JobRequestJSON:
    properties:
      name:
        maxLength: 32
        minLength: 3
        type: string
      scheduler:
        maxLength: 32
        minLength: 3
        type: string
    required:
    - name
    - scheduler
    type: object
  dnsrecords.ZoneStatus:
    properties:
      lastError:
        type: string
      lastSync:
        type: string
      records:
        additionalProperties:
          items:
            type: string
          type: array
        type: object
      supported:
        type: boolean
    type: object
  docker.ContainerCreateRequestContainer:
    properties:
      cap_add:
        items:
          type: string
        type: array
      cap_drop:
        items:
          type: string
        type: array
      command:
        type: string
      container_name:
        type: string
      cpu_shares:
        type: integer
      cpus:
        type: number
      cpuset_cpus:
        type: string
      depends_on:
        additionalProperties:
          $ref: '#/definitions/docker.ContainerCreateRequestContainerDependsOnCont'
        type: object
      devices:
        items:
          type: string
        type: array
      dns:
        items:
          type: string
        type: array
      dns_search:
        items:
          type: string
        type: array
      domainname:
        type: string
      entrypoint:
        type: string
      environment:
        items:
          type: string
        type: array
      expose:
        items:
          type: string
        type: array
      extra_hosts:
        items:
          type: string
        type: array
      gid:
        type: integer
      healthcheck:
        $ref: '#/definitions/docker.ContainerCreateRequestContainerHealthcheck'
      hostname:
        type: string
      image:
        type: string
      isolation:
        type: string
      labels:
        additionalProperties:
          type: string
        type: object
      links:
        items:
          type: string
        type: array
      mac_address:
        type: string
      mem_limit:
        description: Resource constraints
        type: string
      mem_reservation:
        type: string
      network_mode:
        type: string
      networks:
        additionalProperties:
          $ref: '#/definitions/docker.ContainerCreateRequestServiceNetwork'
        type: object
      ports:
        items:
          type: string
        type: array
      post_install:
        items:
          type: string
        type: array
      privileged:
        type: boolean
      restart:
        type: string
      routes:
        items:
          $ref: '#/definitions/utils.ProxyRouteConfig'
        type: array
      runtime:
        type: string
      security_opt:
        items:
          type: string
        type: array
      stdin_open:
        type: boolean
      stop_grace_period:
        type: integer
      stop_signal:
        type: string
      storage_opt:
        additionalProperties:
          type: string
        type: object
      sysctls:
        additionalProperties:
          type: string
        type: object
      tty:
        type: boolean
      uid:
        type: integer
      user:
        type: string
      volumes:
        items:
          $ref: '#/definitions/mount.Mount'
        type: array
      working_dir:
        type: string
    required:
    - image
    type: object
  docker.ContainerCreateRequestContainerDependsOnCont:
    properties:
      condition:
        type: string
      restart:
        type: string
    type: object
  docker.ContainerCreateRequestContainerHealthcheck:
    properties:
      interval:
        type: integer
      retries:
        type: integer
      start_period:
        type: integer
      test:
        items:
          type: string
        type: array
      timeout:
        type: integer
    type: object
  docker.ContainerCreateRequestNetwork:
    properties:
      attachable:
        type: boolean
      driver:
        type: string
      enable_ipv6:
        type: boolean
      internal:
        type: boolean
      ipam:
        properties:
          config:
            items:
              $ref: '#/definitions/docker.ContainerCreateRequestNetworkIPAMConfig'
            type: array
          driver:
            type: string
        type: object
      labels:
        additionalProperties:
          type: string
        type: object
      name:
        description: name must be unique
        type: string
    type: object
  docker.ContainerCreateRequestNetworkIPAMConfig:
    properties:
      gateway:
        type: string
      subnet:
        type: string
    type: object
  docker.ContainerCreateRequestServiceNetwork:
    properties:
      aliases:
        items:
          type: string
        type: array
      ipv4_address:
        type: string
      ipv6_address:
        type: string
    type: object
  docker.ContainerCreateRequestVolume:
    properties:
      driver:
        type: string
      labels:
        additionalProperties:
          type: string
        type: object
      name:
        description: name must be unique
        type: string
      source:
        type: string
      target:
        type: string
    type: object
  docker.ContainerForm:
    properties:
      Volumes:
        items:
          $ref: '#/definitions/mount.Mount'
        type: array
      cpus:
        type: number
      devices:
        items:
          type: string
        type: array
      dns:
        description: DNS replaces the DNS servers of the container when sent, an empty
          list for the default of Docker
        items:
          type: string
        type: array
      envVars:
        items:
          type: string
        type: array
      image:
        type: string
      interactive:
        description: we make this a int so that we can ignore 0
        type: integer
      labels:
        additionalProperties:
          type: string
        type: object
      memLimit:
        type: string
      networkMode:
        type: string
      portBindings:
        $ref: '#/definitions/nat.PortMap'
      restartPolicy:
        type: string
      user:
        type: string
    type: object
  docker.DockerServiceCreateRequest:
    properties:
      networks:
        additionalProperties:
          $ref: '#/definitions/docker.ContainerCreateRequestNetwork'
        type: object
      services:
        additionalProperties:
          $ref: '#/definitions/docker.ContainerCreateRequestContainer'
        type: object
      volumes:
        additionalProperties:
          $ref: '#/definitions/docker.ContainerCreateRequestVolume'
        type: object
    type: object
  docker.VolumeCreateRequest:
    properties:
      driver:
        type: string
      name:
        type: string
    required:
    - name
    type: object
  docker.createNetworkPayload:
    properties:
      attachCosmos:
        type: boolean
      driver:
        type: string
      name:
        type: string
      parentInterface:
        type: string
      subnet:
        type: string
    required:
    - name
    type: object
  docker.migrateToHostMode:
    properties:
      http:
        type: string
      https:
        type: string
    required:
    - http
    - https
    type: object
  github_com_azukaar_cosmos-server_src_utils.Config:
    properties:
      APITokens:
        additionalProperties:
          $ref: '#/definitions/utils.APITokenConfig'
        type: object
      Roles:
        additionalProperties:
          $ref: '#/definitions/utils.RoleConfig'
        type: object
      adminConstellationOnly:
        type: boolean
      adminWhitelistIPs:
        items:
          type: string
        type: array
      agentMode:
        type: boolean
      autoUpdate:
        type: boolean
      backup:
        $ref: '#/definitions/utils.BackupConfig'
      backupOutputDir:
        type: string
      betaUpdates:
        type: boolean
      blockedCountries:
        items:
          type: string
        type: array
      constellationConfig:
        $ref: '#/definitions/utils.ConstellationConfig'
      countryBlacklistIsWhitelist:
        type: boolean
      cron:
        additionalProperties:
          $ref: '#/definitions/utils.CRONConfig'
        type: object
      database:
        $ref: '#/definitions/utils.DatabaseConfig'
      disableHostModeWarning:
        type: boolean
      disableOpenIDDirect:
        type: boolean
      disableUserManagement:
        type: boolean
      dockerConfig:
        $ref: '#/definitions/utils.DockerConfig'
      emailConfig:
        $ref: '#/definitions/utils.EmailConfig'
      homepageConfig:
        $ref: '#/definitions/utils.HomepageConfig'
      httpconfig:
        $ref: '#/definitions/utils.HTTPConfig'
      incrBackupOutputDir:
        type: string
      licence:
        type: string
      loggingLevel:
        type: string
      marketConfig:
        $ref: '#/definitions/utils.MarketConfig'
      monitoringAlerts:
        additionalProperties:
          $ref: '#/definitions/utils.Alert'
        type: object
      monitoringDisabled:
        type: boolean
      mpdn_:
        type: string
      mpdu_:
        type: string
      newInstall:
        type: boolean
      openIDClients:
        items:
          $ref: '#/definitions/utils.OpenIDClient'
        type: array
      remoteStorage:
        $ref: '#/definitions/utils.RemoteStorageConfig'
      requireMFA:
        type: boolean
      serverCountry:
        type: string
      serverToken:
        type: string
      shieldWhitelist:
        items:
          $ref: '#/definitions/utils.ShieldWhitelistEntry'
        type: array
      storage:
        $ref: '#/definitions/utils.StorageConfig'
      themeConfig:
        $ref: '#/definitions/utils.ThemeConfig'
    required:
    - emailConfig
    - httpconfig
    type: object
  image.Metadata:
    properties:
      lastTagTime:
        description: LastTagTime is the date and time at which the image was last
          tagged.
        type: string
    type: object
  main.NewInstallJSON:
    properties:
      allowHTTPLocalIPAccess:
        type: boolean
      dnsChallengeProvider:
        type: string
      dnschallengeConfig:
        additionalProperties:
          type: string
        type: object
      hostname:
        type: string
      httpsCertificateMode:
        type: string
      mongodbMode:
        type: string
      nickname:
        type: string
      omitempty:
        type: string
      password:
        type: string
      sslEmail:
        type: string
      step:
        type: string
      tlsCert:
        type: string
      tlsKey:
        type: string
      useWildcardCertificate:
        type: boolean
    type: object
  main.ServerUpdateCheck:
    properties:
      containerized:
        type: boolean
      currentVersion:
        type: string
      latestVersion:
        type: string
      updateAvailable:
        type: boolean
    type: object
  main.SetupJSON:
    properties:
      DNSChallengeConfig:
        additionalProperties:
          type: string
        type: object
      allowHTTPLocalIPAccess:
        type: boolean
      clearConfig:
        description: 'Optional: clear config before setup'
        type: boolean
      constellationConfig:
        description: 'Optional: Constellation connect'
        type: string
      createAdminToken:
        description: 'Optional: create admin API token'
        type: boolean
      databaseNodeName:
        description: 'Optional: overrides the node column on metrics rows. Defaults
          to the hostname when empty, which is what a single-node install wants.'
        type: string
      dnsChallengeProvider:
        type: string
      email:
        type: string
      hostname:
        description: HTTPS
        type: string
      httpsCertificateMode:
        type: string
      licence:
        description: |-
          Optional: Pro licence key — stored on the lighthouse config and
          validated via utils.ProcessLicence at the end of setup.
        type: string
      mongodbMode:
        description: Database
        type: string
      nickname:
        description: Admin
        type: string
      password:
        type: string
      postgresDatabase:
        type: string
      postgresHost:
        description: 'Optional: point this node at a shared Postgres instead of the
          local SQL store'
        type: string
      postgresPassword:
        type: string
      postgresUsername:
        type: string
      sslEmail:
        type: string
      tlsCert:
        type: string
      tlsKey:
        type: string
      useWildcardCertificate:
        type: boolean
    type: object
  main.SetupJoinJSON:
    properties:
      constellationConfig:
        description: ConstellationConfig is the constellation file of this server,
          as created on the cluster
        type: string
      hostname:
        description: Hostname overrides the one derived from the cluster domain (<device>.<cluster
          domain>)
        type: string
      preview:
        description: Preview only returns the hostname the server would take, nothing
          is saved
        type: boolean
    required:
    - constellationConfig
    type: object
  mount.BindOptions:
    properties:
      createMountpoint:
        type: boolean
      nonRecursive:
        type: boolean
      propagation:
        $ref: '#/definitions/mount.Propagation'
      readOnlyForceRecursive:
        description: ReadOnlyForceRecursive raises an error if the mount cannot be
          made recursively read-only.
        type: boolean
      readOnlyNonRecursive:
        description: |-
          ReadOnlyNonRecursive makes the mount non-recursively read-only, but still leaves the mount recursive
          (unless NonRecursive is set to true in conjunction).
        type: boolean
    type: object
  mount.ClusterOptions:
    type: object
  mount.Consistency:
    enum:
    - consistent
    - cached
    - delegated
    - default
    type: string
    x-enum-varnames:
    - ConsistencyFull
    - ConsistencyCached
    - ConsistencyDelegated
    - ConsistencyDefault
  mount.Driver:
    properties:
      name:
        type: string
      options:
        additionalProperties:
          type: string
        type: object
    type: object
  mount.Mount:
    properties:
      bindOptions:
        $ref: '#/definitions/mount.BindOptions'
      clusterOptions:
        $ref: '#/definitions/mount.ClusterOptions'
      consistency:
        $ref: '#/definitions/mount.Consistency'
      readOnly:
        description: attempts recursive read-only if possible
        type: boolean
      source:
        description: |-
          Source specifies the name of the mount. Depending on mount type, this
          may be a volume name or a host path, or even ignored.
          Source is not supported for tmpfs (must be an empty value)
        type: string
      target:
        type: string
      tmpfsOptions:
        $ref: '#/definitions/mount.TmpfsOptions'
      type:
        $ref: '#/definitions/mount.Type'
      volumeOptions:
        $ref: '#/definitions/mount.VolumeOptions'
    type: object
  mount.Propagation:
    enum:
    - rprivate
    - private
    - rshared
    - shared
    - rslave
    - slave
    type: string
    x-enum-varnames:
    - PropagationRPrivate
    - PropagationPrivate
    - PropagationRShared
    - PropagationShared
    - PropagationRSlave
    - PropagationSlave
  mount.TmpfsOptions:
    properties:
      mode:
        allOf:
        - $ref: '#/definitions/os.FileMode'
        description: Mode of the tmpfs upon creation
      sizeBytes:
        description: |-
          Size sets the size of the tmpfs, in bytes.

          This will be converted to an operating system specific value
          depending on the host. For example, on linux, it will be converted to
          use a 'k', 'm' or 'g' syntax. BSD, though not widely supported with
          docker, uses a straight byte value.

          Percentages are not supported.
        type: integer
    type: object
  mount.Type:
    enum:
    - bind
    - volume
    - tmpfs
    - npipe
    - cluster
    type: string
    x-enum-varnames:
    - TypeBind
    - TypeVolume
    - TypeTmpfs
