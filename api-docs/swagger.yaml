    get:
      consumes:
      - application/json
      description: |-
        GET returns the site with its deployments; PUT replaces its route
        configuration (host, internal, spa, tags — absent fields keep their
        stored value); DELETE removes the site and all its deployments (the
        stored zips are reclaimed by the next GC pass) (Pro feature)
      parameters:
      - description: Registry name
        in: path
        name: name
        required: true
        type: string
      - description: Site name
        in: path
        name: site
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Get, configure or delete one static site
      tags:
      - registry
