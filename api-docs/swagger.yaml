      autoUpdate:
        type: boolean
      backup:
        $ref: '#/definitions/utils.BackupConfig'
      backupOutputDir:
        type: string
      betaUpdates:
        type: boolean
      blockedCountries:
        items:
          type: string
        type: array
      constellationConfig:
        $ref: '#/definitions/utils.ConstellationConfig'
      countryBlacklistIsWhitelist:
        type: boolean
      cron:
        additionalProperties:
          $ref: '#/definitions/utils.CRONConfig'
        type: object
      database:
        $ref: '#/definitions/utils.DatabaseConfig'
      disableHostModeWarning:
        type: boolean
      disableOpenIDDirect:
        type: boolean
      disableUserManagement:
        type: boolean
      dockerConfig:
        $ref: '#/definitions/utils.DockerConfig'
      emailConfig:
        $ref: '#/definitions/utils.EmailConfig'
      homepageConfig:
        $ref: '#/definitions/utils.HomepageConfig'
      httpconfig:
        $ref: '#/definitions/utils.HTTPConfig'
      incrBackupOutputDir:
        type: string
      licence:
        type: string
      loggingLevel:
        type: string
      marketConfig:
        $ref: '#/definitions/utils.MarketConfig'
      monitoringAlerts:
        additionalProperties:
          $ref: '#/definitions/utils.Alert'
        type: object
      monitoringDisabled:
        type: boolean
      mpdn_:
        type: string
      mpdu_:
        type: string
      newInstall:
        type: boolean
      openIDClients:
        items:
          $ref: '#/definitions/utils.OpenIDClient'
        type: array
      remoteStorage:
        $ref: '#/definitions/utils.RemoteStorageConfig'
      requireMFA:
        type: boolean
      serverCountry:
        type: string
      serverToken:
        type: string
      storage:
        $ref: '#/definitions/utils.StorageConfig'
      themeConfig:
        $ref: '#/definitions/utils.ThemeConfig'
    required:
    - emailConfig
    - httpconfig
    type: object
  image.Metadata:
    properties:
      lastTagTime:
        description: LastTagTime is the date and time at which the image was last
          tagged.
        type: string
    type: object
  main.NewInstallJSON:
    properties:
      allowHTTPLocalIPAccess:
        type: boolean
      dnsChallengeProvider:
        type: string
      dnschallengeConfig:
        additionalProperties:
          type: string
        type: object
      hostname:
        type: string
      httpsCertificateMode:
        type: string
      mongodbMode:
        type: string
      nickname:
        type: string
      omitempty:
        type: string
      password:
        type: string
      sslEmail:
        type: string
      step:
        type: string
      tlsCert:
        type: string
      tlsKey:
        type: string
      useWildcardCertificate:
        type: boolean
    type: object
  main.SetupJSON:
    properties:
      DNSChallengeConfig:
        additionalProperties:
          type: string
        type: object
      allowHTTPLocalIPAccess:
        type: boolean
      clearConfig:
        description: 'Optional: clear config before setup'
        type: boolean
      constellationConfig:
        description: 'Optional: Constellation connect'
        type: string
      createAdminToken:
        description: 'Optional: create admin API token'
        type: boolean
      databaseNodeName:
        description: 'Optional: overrides the node column on metrics rows. Defaults
          to the hostname when empty, which is what a single-node install wants.'
        type: string
      dnsChallengeProvider:
        type: string
      email:
        type: string
      hostname:
        description: HTTPS
        type: string
      httpsCertificateMode:
        type: string
      licence:
        description: |-
          Optional: Pro licence key — stored on the lighthouse config and
          validated via utils.ProcessLicence at the end of setup.
        type: string
      mongodbMode:
        description: Database
        type: string
      nickname:
        description: Admin
        type: string
      password:
        type: string
      postgresDatabase:
        type: string
      postgresHost:
        description: 'Optional: point this node at a shared Postgres instead of the
          local SQL store'
        type: string
      postgresPassword:
        type: string
      postgresUsername:
        type: string
      sslEmail:
        type: string
      tlsCert:
        type: string
      tlsKey:
        type: string
      useWildcardCertificate:
        type: boolean
    type: object
  mount.BindOptions:
    properties:
      createMountpoint:
        type: boolean
      nonRecursive:
        type: boolean
      propagation:
        $ref: '#/definitions/mount.Propagation'
      readOnlyForceRecursive:
        description: ReadOnlyForceRecursive raises an error if the mount cannot be
          made recursively read-only.
        type: boolean
      readOnlyNonRecursive:
        description: |-
          ReadOnlyNonRecursive makes the mount non-recursively read-only, but still leaves the mount recursive
          (unless NonRecursive is set to true in conjunction).
        type: boolean
    type: object
  mount.ClusterOptions:
    type: object
  mount.Consistency:
    enum:
    - consistent
    - cached
    - delegated
    - default
    type: string
    x-enum-varnames:
    - ConsistencyFull
    - ConsistencyCached
    - ConsistencyDelegated
    - ConsistencyDefault
  mount.Driver:
    properties:
      name:
        type: string
      options:
        additionalProperties:
          type: string
        type: object
    type: object
  mount.Mount:
    properties:
      bindOptions:
        $ref: '#/definitions/mount.BindOptions'
      clusterOptions:
        $ref: '#/definitions/mount.ClusterOptions'
      consistency:
        $ref: '#/definitions/mount.Consistency'
      readOnly:
        description: attempts recursive read-only if possible
        type: boolean
      source:
        description: |-
          Source specifies the name of the mount. Depending on mount type, this
          may be a volume name or a host path, or even ignored.
          Source is not supported for tmpfs (must be an empty value)
        type: string
      target:
        type: string
      tmpfsOptions:
        $ref: '#/definitions/mount.TmpfsOptions'
      type:
        $ref: '#/definitions/mount.Type'
      volumeOptions:
        $ref: '#/definitions/mount.VolumeOptions'
    type: object
  mount.Propagation:
    enum:
    - rprivate
    - private
    - rshared
    - shared
    - rslave
    - slave
    type: string
    x-enum-varnames:
    - PropagationRPrivate
    - PropagationPrivate
    - PropagationRShared
    - PropagationShared
    - PropagationRSlave
    - PropagationSlave
  mount.TmpfsOptions:
    properties:
      mode:
        allOf:
        - $ref: '#/definitions/os.FileMode'
        description: Mode of the tmpfs upon creation
      sizeBytes:
        description: |-
          Size sets the size of the tmpfs, in bytes.

          This will be converted to an operating system specific value
          depending on the host. For example, on linux, it will be converted to
          use a 'k', 'm' or 'g' syntax. BSD, though not widely supported with
          docker, uses a straight byte value.

          Percentages are not supported.
        type: integer
    type: object
  mount.Type:
    enum:
    - bind
    - volume
    - tmpfs
    - npipe
    - cluster
    type: string
    x-enum-varnames:
    - TypeBind
    - TypeVolume
    - TypeTmpfs
    - TypeNamedPipe
    - TypeCluster
  mount.VolumeOptions:
    properties:
      driverConfig:
        $ref: '#/definitions/mount.Driver'
      labels:
        additionalProperties:
          type: string
        type: object
      noCopy:
        type: boolean
      subpath:
        type: string
    type: object
  nat.PortBinding:
    properties:
      HostIp:
        description: HostIP is the host IP Address
        type: string
      hostPort:
        description: HostPort is the host port number
        type: string
    type: object
  nat.PortMap:
    additionalProperties:
      items:
        $ref: '#/definitions/nat.PortBinding'
      type: array
    type: object
  nat.PortSet:
    additionalProperties:
      type: object
    type: object
  os.FileMode:
