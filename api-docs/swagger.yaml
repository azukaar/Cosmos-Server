      parameters:
      - description: Instance name
        in: path
        name: name
        required: true
        type: string
      - description: Storage cap
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/pro.SeaweedFSStorageRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Change the per-node storage cap of a managed SeaweedFS instance
      tags:
      - seaweedfs
  /api/constellation/seaweedfs/{name}/upgrade:
    post:
      consumes:
      - application/json
      description: |-
        Starts a rolling upgrade to the given image: the masters one at a time, then the volume
