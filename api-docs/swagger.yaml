      parameters:
      - description: State file
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/pro.ProState'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Import a Pro state file
      tags:
      - state
  /api/constellation/state/start-empty:
    post:
      description: |-
        Removes the import-in-progress marker left by a failed import or reseed, accepting the
        deployments bucket as it is and letting the scheduler reconcile again. Pro feature.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Clear a frozen state import
      tags:
      - state
  /api/constellation/tag-nodes:
    get:
      description: |-
        Returns the nodes whose tags satisfy every requested tag (AND
        semantics; an empty tag set matches every node), each flagged with
        whether it is currently heartbeating, plus the cluster totals the
        UI needs for a "matches N of M nodes" hint (Pro feature).
