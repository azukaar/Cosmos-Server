  /api/constellation/registries:
    get:
      description: Returns every registry with the accesses publishing it and its
        stored-size rollup, secrets redacted (Pro feature)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: List package registries
      tags:
      - registry
    post:
      consumes:
      - application/json
      description: |-
        Claims the name, provisions the backing bucket and marks the registry ready.
        A registry is typed storage (docker/npm/static/generic): publish it by creating
        an access (Pro feature).
      parameters:
      - description: Registry to create
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/pro.RegistryCreateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Create a package registry
      tags:
      - registry
  /api/constellation/registries/{name}:
    delete:
      description: |-
        Removes the record and every metadata key. Refused while an access
        still publishes it. Stored blobs are PRESERVED unless purgeData=true,
        which best-effort empties the backing bucket (the bucket itself is
        left in place) (Pro feature).
      parameters:
      - description: Registry name
        in: path
        name: name
        required: true
        type: string
      - description: Also delete every stored blob
        in: query
        name: purgeData
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Delete a package registry
      tags:
      - registry
    get:
      description: Returns the registry with the accesses publishing it and its stored-size
        rollup, secrets redacted (Pro feature)
      parameters:
      - description: Registry name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Get one package registry
      tags:
      - registry
  /api/constellation/registries/{name}/gc:
    post:
      description: |-
        Starts a mark-and-sweep of the registry's blob store and reconciles its
        stored-size and package counters. Returns 202 immediately; the outcome
        arrives as a cosmos.registry.gc event. Blobs younger than 24 hours are
        never collected, whether or not anything references them (Pro feature).
      parameters:
      - description: Registry name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Run a registry's garbage collection now
      tags:
      - registry
  /api/constellation/registries/{name}/packages:
    get:
      description: Returns every package with its versions and their files (Pro feature)
      parameters:
      - description: Registry name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: List the packages of a generic or pypi registry
      tags:
      - registry
  /api/constellation/registries/{name}/packages/{package}:
    get:
      description: |-
        GET returns the package with its versions and files; DELETE removes the
        package and every version (the stored files are reclaimed by the next
        GC pass) (Pro feature)
      parameters:
      - description: Registry name
        in: path
        name: name
        required: true
        type: string
      - description: Package name
        in: path
        name: package
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Get or delete one generic or pypi package
      tags:
      - registry
  /api/constellation/registries/{name}/packages/{package}/versions:
    post:
      consumes:
      - application/octet-stream
      description: |-
        Stores one or more files under a version. Accepts a multipart form (every
        file part is stored under its own filename) or a single raw file as the
        request body, in which case the filename query parameter is required.
        Query parameters: version (default: a UTC timestamp), filename. A file
        that already exists in the version is refused (409): upload a new version
        or delete it first. Accepts a Cosmos token with the Resources permission
        OR a registry deploy token with push scope on an access that exposes this
        registry (Pro feature).
      parameters:
      - description: Registry name
        in: path
        name: name
        required: true
        type: string
      - description: Package name
        in: path
        name: package
        required: true
        type: string
      - description: 'Version (default: UTC timestamp)'
        in: query
        name: version
        type: string
      - description: Filename, required for a raw body
        in: query
        name: filename
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Upload files into a generic package version
      tags:
      - registry
  /api/constellation/registries/{name}/packages/{package}/versions/{version}:
    delete:
      description: |-
        Removes the version and its file entries; the stored files are reclaimed
        by the next GC pass. "latest" is re-pointed at the newest remaining
        version (Pro feature).
      parameters:
      - description: Registry name
        in: path
        name: name
        required: true
        type: string
      - description: Package name
        in: path
        name: package
        required: true
        type: string
      - description: Version
        in: path
        name: version
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Delete one generic or pypi package version
      tags:
      - registry
  /api/constellation/registries/{name}/packages/{package}/versions/{version}/files/{file}:
    get:
      description: |-
        GET streams the file (the version may be "latest"); accepts a Cosmos token
        with the Resources read permission OR a registry deploy token with pull
        scope. DELETE removes the file entry — and the version, when it was its
        last file; the stored bytes are reclaimed by the next GC pass (Pro feature).
      parameters:
      - description: Registry name
        in: path
        name: name
        required: true
        type: string
      - description: Package name
        in: path
        name: package
        required: true
        type: string
      - description: Version, or latest
        in: path
        name: version
        required: true
        type: string
      - description: Filename
        in: path
        name: file
        required: true
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: OK
          schema:
            type: file
      security:
      - BearerAuth: []
      summary: Download or delete one file of a generic or pypi package version
      tags:
      - registry
